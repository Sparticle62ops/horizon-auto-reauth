name: swap-release-asset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/swap-asset.yml']

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize files not tracked on main
        run: |
          set -e
          python3 - <<'PY'
          import base64
          open('Cargo.lock','wb').write(base64.b64decode("IyBUaGlzIGZpbGUgaXMgYXV0b21hdGljYWxseSBAZ2VuZXJhdGVkIGJ5IENhcmdvLgojIEl0IGlzIG5vdCBpbnRlbmRlZCBmb3IgbWFudWFsIGVkaXRpbmcu CiB2ZXJzaW9uID0gNAr="))
          open('LICENSE','wb').write(base64.b64decode(""))
          PY
          L=$(sha256sum Cargo.lock | cut -d' ' -f1)
          if [ "$L" != "b04d33cc2de3be7595bf57c136fd5b122f612acced9552e0d174b4199bbe0b5b" ]; then echo "Cargo.lock sha mismatch: $L"; exit 1; fi
          L=$(sha256sum LICENSE | cut -d' ' -f1)
          if [ "$L" != "6c05312e2b29bcf24ac915395e0c97b5bfde84828ad1e337be5410a108b4d44e" ]; then echo "LICENSE sha mismatch: $L"; exit 1; fi

      - name: Package and verify the .hmod
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          members = ['Cargo.lock','Cargo.toml','LICENSE','README.md','horizon-mod.toml','src/lib.rs','src/runtime.rs']
          with zipfile.ZipFile('auto_reauth-1.0.0.hmod','w') as z:
              for m in members:
                  zi = zipfile.ZipInfo(m, date_time=(2026,11,21,0,0,0))
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  zi.external_attr = 0o644 << 16
                  z.writestr(zi, open(m,'rb').read())
          PY
          GOT=$(sha256sum auto_reauth-1.0.0.hmod | cut -d' ' -f1)
          echo "package sha256: $GOT"
          if [ "$GOT" != "e2740489952743f76e2cd5e2626836f577e1a8a6b097c51acb5864a063b84416" ]; then
            echo "package sha mismatch"
            exit 1
          fi

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload v1.0.0 auto_reauth-1.0.0.hmod --clobber
          gh release delete-asset v1.0.0 auto_reauth-1.0.0.hnmod --yes

      - name: Clean up and remove this workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/swap-asset.yml
          git add LICENSE
          git commit -m "Add MIT LICENSE from upstream; remove temporary release-asset workflow"
          git push origin HEAD:main
